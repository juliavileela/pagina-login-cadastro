<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="stylle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <div class="container">
        <div class="esquerda">
            <div class="card">
                <div class="topo">
                    <h3>START FOR FREE</h3>
                </div>
                <div class="meio">
                    <h1>Create a new account.</h1>
                    <p>Embark on a journey to a Healthtier lifestyle with Our fitness and Wellness community. Sign Up Today!</p>
                </div>
                <div class="fim">
                    <div class="feedback">
                        <div class="cima">
                            <p>Sign up for this wellness website was the best decision I made for my health</p>
                        </div>
                        <div class="baixo">
                            <img 
                                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqKPK366eheamhE0Y8l7lX-qx-z-zbrkojKWFDJM-tjydae5n8z3z6pmQY&s=10"
                                alt="" width="50px">
                            <div class="info">
                                <h3>James Anderson</h3>
                                <p>Athlete</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="direita">
            <div class="topo">
                <h3>Get Start</h3>
                <p>Already a member? <a href="#">Log in</a> </p>
            </div>
            <div class="meio">
                <div class="input">
                    <div class="inputs">
                        <div class="name">
                            <label for="">First Name</label>
                            <input type="text" id="lb">
                        </div>
                        <div class="name">
                            <label for="">Last Name</label>
                            <input id="lb" type="text">
                        </div>
                    </div>
                </div>
                <div class="input">
                    <label for="">Gender</label>
                    <div id="lb" class="inputs">
                        <div class="genero">
                            <input type="radio" name="genero" id="">
                            <label for="">Male</label>
                        </div>
                        <div class="genero">
                            <input type="radio" name="genero" id="">
                            <label for="">Female</label>
                        </div>
                    </div>
                </div>
                <div class="input">
                     <label for="">Email</label>
                     <input id="lb" type="email" name="" id="">
                </div>
            <div class="input">
            <label for="">Password</label>
            <input id="lb" type="password" name="" id="">
        </div>
        <button>Sign up</button>
    </div>
</body>
</html>
